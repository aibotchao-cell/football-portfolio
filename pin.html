<style>
:root{--bg:#fff;--ink:#111;--mute:#767676;--chip:#f1f1f1;--line:#e9e9e9;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI","Microsoft JhengHei",Roboto,sans-serif}
a{color:inherit;text-decoration:none}

/* ---------- top ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:26px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-size:16.5px;font-weight:500;color:#111;padding-bottom:9px;
  border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;opacity:.72}
.tab.on{font-weight:700;opacity:1;border-bottom-color:#111}
.searchrow{padding:0 16px 12px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:10px 14px}
.searchbox input{border:0;background:transparent;outline:0;font-size:14px;width:100%;color:#111}
.searchbox svg{flex:0 0 16px;opacity:.55}

/* ---------- masonry ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:10px 10px 96px}
.masonry{display:flex;gap:10px;align-items:flex-start}
.masonry .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
@media(min-width:620px){.masonry,.masonry .col{gap:12px}}
.pin{break-inside:avoid;margin:0 0 16px;display:block;background:transparent}
@media(min-width:620px){.pin{margin-bottom:20px}}
.pin .ph{position:relative;border-radius:18px;overflow:hidden;background:#eee;
  transition:transform .25s ease,box-shadow .28s ease}
.pin:hover .ph{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.14)}
.pin img{width:100%;display:block;border-radius:18px}
.pin .cap{padding:9px 4px 0;background:transparent}
.pin .ttl{font-size:12.8px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .meta{margin-top:4px;font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:#cfcfcf;display:inline-block}
.pin .more{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;
  font-weight:800;color:#111;font-size:14px}
@media(min-width:620px){.pin:hover .more{display:flex}}
.badge{position:absolute;left:8px;top:8px;background:rgba(17,17,17,.82);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:999px}

.wrap{padding-bottom:30px}

.empty{padding:60px 20px;text-align:center;color:var(--mute);font-size:14px}
</style>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
let filter = 'all';

const whoName = w => w === 'Edward' ? '品衡' : '品安';

function render(){
  const kw = q.value.trim().toLowerCase();
  const list = PINS.filter(p => {
    if (filter === 'Edward' || filter === 'Andrew') { if (p.w !== filter) return false; }
    else if (filter === '2026' || filter === '2025') { if (!String(p.d).startsWith(filter)) return false; }
    else if (filter !== 'all') { if (!(p.t || '').includes(filter)) return false; }
    if (kw && !((p.t||'') + ' ' + p.d + ' ' + whoName(p.w)).toLowerCase().includes(kw)) return false;
    return true;
  });
  if (!list.length){ grid.innerHTML = '<div class="empty">沒有符合的相片</div>'; return; }
  const cols = window.innerWidth >= 1200 ? 5 : window.innerWidth >= 900 ? 4 : window.innerWidth >= 620 ? 3 : 2;
  const buckets = Array.from({length: cols}, () => []);
  list.forEach((p, i) => buckets[i % cols].push(p));   // 左右交錯 → 視覺順序即日期順序
  const card = p => `
    <a class="pin" href="index.html#${p.s}">
      <div class="ph">
        <img loading="lazy" src="${p.img}" alt="${p.t}">
        <span class="more">···</span>
      </div>
      <div class="cap">
        <div class="ttl">${p.t}</div>
        <div class="meta">${whoName(p.w)}<span class="dot"></span>${p.d}</div>
      </div>
    </a>`;
  grid.innerHTML = buckets.map(b => `<div class="col">${b.map(card).join('')}</div>`).join('');
}
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 180); });

document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); filter = t.dataset.f; render();
});
q.addEventListener('input', render);
render();
</script>
