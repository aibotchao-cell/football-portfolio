<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>足球特輯 · 瀑布流</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#767676;--chip:#f1f1f1;--line:#e9e9e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft JhengHei",Roboto,sans-serif}
a{color:inherit;text-decoration:none}

/* ---------- 篩選列 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 12px 10px}
.filters{display:flex;gap:8px;max-width:1500px;margin:0 auto;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.sel{position:relative;flex:0 0 auto}
.sel select{
  -webkit-appearance:none;appearance:none;width:auto;min-width:112px;max-width:200px;border:0;background:var(--chip);color:var(--ink);
  font-size:13.5px;font-weight:600;font-family:inherit;padding:10px 30px 10px 13px;border-radius:999px;
  cursor:pointer;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.sel select:focus{outline:2px solid #111;outline-offset:1px}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:2px solid #555;border-bottom:2px solid #555;transform:rotate(45deg);pointer-events:none}
.sel.on select{background:#111;color:#fff}
.sel.on::after{border-color:#fff}
.status{max-width:1500px;margin:9px auto 0;display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--mute);padding:0 4px}
.status b{color:#111;font-size:14px}
.status button{border:0;background:none;color:#111;font-size:12.5px;font-weight:700;cursor:pointer;
  text-decoration:underline;padding:0;display:none;font-family:inherit}
.status button.show{display:inline}

/* ---------- 瀑布流 ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:12px 10px 60px}
.masonry{display:flex;gap:10px;align-items:flex-start}
.masonry .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
@media(min-width:620px){.masonry,.masonry .col{gap:12px}}
.pin{break-inside:avoid;display:block;background:transparent}
.pin .ph{position:relative;border-radius:18px;overflow:hidden;background:#eee;aspect-ratio:1 / var(--ar,1);
  transition:transform .25s ease,box-shadow .28s ease}
.pin:hover .ph{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.14)}
.pin img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:18px}
.pin .cap{padding:9px 4px 0}
.pin .ttl{font-size:12.8px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .meta{margin-top:4px;font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:#cfcfcf;display:inline-block}
.more{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:14px}
@media(min-width:620px){.pin:hover .more{display:flex}}
.empty{padding:60px 20px;text-align:center;color:var(--mute);font-size:14px;grid-column:1/-1}
</style>
</head>
<body>

<div class="topbar">
  <div class="filters">
    <div class="sel" id="sel-y"><select id="f-y" aria-label="年份"></select></div>
    <div class="sel" id="sel-who"><select id="f-who" aria-label="品衡或品安"></select></div>
    <div class="sel" id="sel-tour"><select id="f-tour" aria-label="賽事"></select></div>
    <div class="sel" id="sel-opp"><select id="f-opp" aria-label="對手"></select></div>
  </div>
  <div class="status">
    <span>共 <b id="cnt">0</b> 場</span>
    <button id="clear">清除篩選</button>
  </div>
</div>

<div class="wrap"><div class="masonry" id="grid"></div></div>

人制", "opp": "TFA", "img": "img/andrew001/006.jpg?v=54265713", "ar": 0.78}, {"s": "andrew109", "d": "2023-01-15", "y": "2023", "t": "金兔賀歲盃 紅鷹 vs 磐石", "w": "Andrew", "tour": "賀歲盃", "opp": "磐石", "img": "img/andrew109/001.jpg?v=47b80e2f", "ar": 0.88}, {"s": "andrew107", "d": "2022-12-10", "y": "2022", "t": "新北八人 U12 紅鷹 紅鷹 vs AC Taipei", "w": "Andrew", "tour": "新北八人制", "opp": "AC Taipei", "img": "img/andrew107/001.jpg?v=41a014a0", "ar": 1.0}, {"s": "andrew105", "d": "2022-11-19", "y": "2022", "t": "YAMAHA盃 紅鷹 vs 莒光國小", "w": "Andrew", "tour": "YAMAHA CUP", "opp": "莒光國小", "img": "img/andrew105/001.jpg?v=e1e1a2db", "ar": 0.86}, {"s": "andrew106", "d": "2022-11-19", "y": "2022", "t": "YAMAHA盃 紅鷹 vs 新市木蘭", "w": "Andrew", "tour": "YAMAHA CUP", "opp": "新市木蘭", "img": "img/andrew106/001.jpg?v=e04d117a", "ar": 0.94}, {"s": "andrew104", "d": "2022-11-13", "y": "2022", "t": "全國學童盃 公開組 五年級 冠軍賽 紅鯨 vs 大安", "w": "Andrew", "tour": "全國學童盃", "opp": "大安", "img": "img/andrew104/001.jpg?v=eba55ffc", "ar": 0.8}];
const WHO = w => w === 'Edward' ? '品衡' : '品安';

/* ---------- 狀態（可從網址還原） ---------- */
const S = { y: '', who: '', tour: '', opp: '' };
const qp = new URLSearchParams(location.search);
['y','who','tour','opp'].forEach(k => { if (qp.get(k)) S[k] = qp.get(k); });

const KEYS = ['y','who','tour','opp'];
const match = (p, skip) => {
  if (S.y && skip !== 'y' && p.y !== S.y) return false;
  if (S.who && skip !== 'who' && p.w !== S.who) return false;
  if (S.tour && skip !== 'tour' && p.tour !== S.tour) return false;
  if (S.opp && skip !== 'opp' && p.opp !== S.opp) return false;
  return true;
};

/* ---------- 下拉選項（場數依其他條件即時計算） ---------- */
const DIMS = [
  { key:'y',    el:'f-y',    label:'年份',  all:'全部年份', val:p=>p.y },
  { key:'who',  el:'f-who',  label:'人物',  all:'品衡＋品安', val:p=>p.w, txt:v=>WHO(v) },
  { key:'tour', el:'f-tour', label:'賽事',  all:'全部賽事', val:p=>p.tour },
  { key:'opp',  el:'f-opp',  label:'對手',  all:'全部對手', val:p=>p.opp },
];

function buildSelects(){
  DIMS.forEach(d => {
    const counts = new Map();
    PINS.filter(p => match(p, d.key)).forEach(p => {
      const v = d.val(p); if (!v) return;
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    let items = [...counts.entries()];
    if (d.key === 'opp') items = items.filter(([v,n]) => n >= 2);   // 單次對手用搜尋
    items.sort(d.key === 'y' ? (a,b) => b[0].localeCompare(a[0]) : (a,b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));

    const sel = document.getElementById(d.el);
    const total = PINS.filter(p => match(p, d.key)).length;
    sel.innerHTML = `<option value="">${d.all}（${total}）</option>` +
      items.map(([v,n]) => `<option value="${v}">${d.txt ? d.txt(v) : v}（${n}）</option>`).join('');
    sel.value = S[d.key] || '';
    document.getElementById('sel-' + d.key).classList.toggle('on', !!S[d.key]);
  });
}

/* ---------- 瀑布流 ---------- */
const grid = document.getElementById('grid');
const card = p => `
  <a class="pin" href="index.html#${p.s}">
    <div class="ph" style="--ar:${p.ar}">
      <img loading="lazy" src="${p.img}" alt="${p.t}">
      <span class="more">···</span>
    </div>
    <div class="cap">
      <div class="ttl">${p.t}</div>
      <div class="meta">${WHO(p.w)}<span class="dot"></span>${p.d}${p.opp ? '<span class="dot"></span>' + p.opp : ''}</div>
    </div>
  </a>`;

function render(){
  const list = PINS.filter(p => match(p, null));
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('clear').classList.toggle('show', !!(S.y || S.who || S.tour || S.opp));

  if (!list.length){ grid.innerHTML = '<div class="empty">沒有符合的比賽，換個條件試試</div>'; return; }
  const cols = window.innerWidth >= 1200 ? 5 : window.innerWidth >= 900 ? 4 : window.innerWidth >= 620 ? 3 : 2;
  const buckets = Array.from({length: cols}, () => []);
  list.forEach((p, i) => buckets[i % cols].push(p));   // 左右交錯 → 視覺順序＝日期順序
  grid.innerHTML = buckets.map(b => `<div class="col">${b.map(card).join('')}</div>`).join('');
}

function syncUrl(){
  const u = new URL(location.href);
  ['y','who','tour','opp'].forEach(k => { S[k] ? u.searchParams.set(k, S[k]) : u.searchParams.delete(k); });
  history.replaceState(null, '', u);
}

DIMS.forEach(d => {
  document.getElementById(d.el).addEventListener('change', e => {
    S[d.key] = e.target.value; syncUrl(); buildSelects(); render();
  });
});
document.getElementById('clear').addEventListener('click', () => {
  Object.assign(S, {y:'',who:'',tour:'',opp:''});
  syncUrl(); buildSelects(); render();
});
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 180); });

buildSelects(); render();
</script>
